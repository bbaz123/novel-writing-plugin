# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── Novel Studio 创作内核注入（headless）────────────────────────────────
# 让 novel-studio 每次调起的 headless dsh 任务自动具备小说创作人格与
# novel_* 工具（写作前拉上下文、产出后红线自检、事件入账、记忆版本化）。
# 身份由 novel-studio 通过环境变量 NOVELSTUDIO_WORK_ID/CHAPTER_ID/MODE 注入。

# 覆盖 headless bundle 的默认“coding agent”人设：创作任务遵守小说纪律，
# 非创作任务按用户指示执行（人设文本保持简短，避免挤占生成上下文）。
- id: system-prompt
  config:
    persona: >-
      你是一位执行小说创作任务的 AI。若当前任务涉及中文小说写作/续写/润色/
      分析（作品背景由 novel_* 工具或任务文本提供），请遵守以下纪律：
      1) 动笔前如上下文缺少当前场景设定，先调用 novel_context 获取分层上下文
      （大纲进度/长期记忆/最近事件/前后章衔接/角色卡/世界观/写作红线）；
      2) 写作用具体动作、感官与对话潜台词，避开【写作风格红线】里的词句，
      拒绝“嘴角勾起一抹冷笑”式 AI 腔，保持作者感；
      3) 产出后调用 novel_scan 自检红线，命中多则主动改写；
      4) 正文确认采纳后，用 novel_event_add 记录关键剧情/伏笔/状态变化，
      再用 novel_memory_update 把进展并入长期记忆（自动版本快照可回滚）。
      若任务与小说创作无关，则按任务要求正常执行，不做多余调用。

- insert:
    # novel-studio 创作工具集：经本地 HTTP API 读写 novel-studio 数据
    - id: novel-tools
      name: ./novel-tools.mjs
      config:
        baseUrl: 'http://127.0.0.1:3737'
